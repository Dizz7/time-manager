<body>
    <div class="container">
        <div class="current-time">
            <div class="time" id="currentTime">--:--:--</div>
        </div>
        
        <div class="label">Current Time</div>
        
        <label id="testDurationLabel">Test Duration: (Hours:Minutes)</label> 
        <div style="display: flex; justify-content: space-between;">
            <input type="number" id="durationHours" min="0" value="1" placeholder="Hours">
            <input type="number" id="durationMinutes" min="0" max="59" value="0" placeholder="Minutes">
        </div>

        <button id="setDuration">Set Duration</button>
        <button id="submitTime">Start</button>
        
        <label class="bold">Start Time: <span id="startTimeSpan"></span></label>

        <label class="bold">Finish Time: <span id="finishTimeSpan"></span></label>

        <label>40 minutes reminder: <span id="timeWarning1Span"></span></label>
        <label>20 minutes reminder: <span id="timeWarning2Span"></span></label>
        <label>10 minutes reminder: <span id="timeWarning3Span"></span></label>
        <label>5 minutes reminder: <span id="timeWarning4Span"></span></label>

        <button id="resetTime">Reset</button>
    </div>

    <script>
        let durationHours = 1;
        let durationMinutes = 0;

        function updateCurrentTime() {
            const currentTimeElement = document.getElementById("currentTime");
            const now = new Date();
            const options = { timeZone: "America/Santiago", hourCycle: 'h23', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            const formattedTime = now.toLocaleTimeString("en-US", options);
            currentTimeElement.textContent = formattedTime;
        }

        function updateTestDurationLabel() {
            let durationText = "Test Duration: ";
            if (durationHours > 0) {
                durationText += `${durationHours} hour${durationHours > 1 ? 's' : ''}`;
            }
            if (durationMinutes > 0) {
                if (durationHours > 0) {
                    durationText += " ";
                }
                durationText += `${durationMinutes} minute${durationMinutes > 1 ? 's' : ''}`;
            }
            document.getElementById("testDurationLabel").textContent = durationText;
        }

        function calculateTimes() {
            const now = new Date();
            const options = { timeZone: "America/Santiago", hourCycle: 'h23', hour: '2-digit', minute: '2-digit', second: '2-digit' };

            const startTime = now;
            const formattedStartTime = startTime.toLocaleTimeString("en-US", options);

            document.getElementById("startTimeSpan").textContent = formattedStartTime;

            const totalDuration = durationHours * 60 + durationMinutes;
            const warningIntervals = [40, 20, 10, 5].map(warning => totalDuration - warning).filter(minutes => minutes > 0);
            const warnings = warningIntervals.map(minutes => {
                const warningTime = new Date(startTime.getTime() + minutes * 60000);
                return warningTime.toLocaleTimeString("en-US", options);
            });

            const finishTime = new Date(startTime.getTime() + totalDuration * 60000).toLocaleTimeString("en-US", options);

            document.getElementById("timeWarning1Span").textContent = warnings[0] || "--";
            document.getElementById("timeWarning2Span").textContent = warnings[1] || "--";
            document.getElementById("timeWarning3Span").textContent = warnings[2] || "--";
            document.getElementById("timeWarning4Span").textContent = warnings[3] || "--";

            document.getElementById("finishTimeSpan").textContent = finishTime;

            document.getElementById("submitTime").disabled = true;
        }

        function resetState() {
            document.getElementById("submitTime").disabled = false;
            document.getElementById("setDuration").disabled = false;

            document.getElementById("startTimeSpan").textContent = ""; 
            document.getElementById("finishTimeSpan").textContent = ""; 
            document.getElementById("timeWarning1Span").textContent = "";
            document.getElementById("timeWarning2Span").textContent = "";
            document.getElementById("timeWarning3Span").textContent = "";
            document.getElementById("timeWarning4Span").textContent = "";

            document.getElementById("durationHours").value = "1";
            document.getElementById("durationMinutes").value = "0";

            durationHours = 1;
            durationMinutes = 0;

            updateTestDurationLabel();
        }

        function setDuration() {
            const hoursInput = parseInt(document.getElementById("durationHours").value) || 0;
            const minutesInput = parseInt(document.getElementById("durationMinutes").value) || 0;

            durationHours = hoursInput;
            durationMinutes = minutesInput;

            updateTestDurationLabel();
            document.getElementById("setDuration").disabled = true;
        }

        document.getElementById("setDuration").addEventListener("click", setDuration);
        document.getElementById("submitTime").addEventListener("click", calculateTimes);
        document.getElementById("resetTime").addEventListener("click", resetState);

        setInterval(updateCurrentTime, 1000);
        updateCurrentTime();
    </script>
